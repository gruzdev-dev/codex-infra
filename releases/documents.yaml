replicaCount: 1

image:
  repository: gruzdev-dev/codex-documents
  tag: "0.1.0"
  pullPolicy: IfNotPresent

configMap:
  MONGO_HOST: "documents-db"
  MONGO_PORT: "27017"
  MONGO_DATABASE: "codex_documents"
  MONGO_AUTH_SOURCE: "codex_documents"
  MONGO_INITDB_DATABASE: "codex_documents"
  AUTH_SERVICE_ADDR: "auth.codex.svc.cluster.local:8081"
  FILES_SERVICE_ADDR: "files.codex.svc.cluster.local:8081"

secret:
  JWT_SECRET: "jwt_secret"
  INTERNAL_SERVICE_SECRET: "internal_service_secret"
  MONGO_ROOT_USERNAME: "admin"
  MONGO_ROOT_PASSWORD: "admin_secret"
  MONGO_USERNAME: "codex_documents"
  MONGO_PASSWORD: "secret"
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "admin_secret"
  MONGO_INITDB_USERNAME: "codex_documents"
  MONGO_INITDB_PASSWORD: "secret"

service:
  http:
    enabled: true
    port: 8080
  grpc:
    enabled: true
    port: 8081

database:
  enabled: true
  image: "mongo:8.0"
  port: 27017
  migrations:
    enabled: false

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/auth-url: "http://auth.codex.svc.cluster.local:8080/api/v1/validate"
  hosts:
    - host: localhost
      paths:
        - path: /documents(/|$)(.*)
          pathType: ImplementationSpecific

podAnnotations:
  linkerd.io/inject: enabled

networkPolicy:
  enabled: true
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx
      - podSelector: {}
