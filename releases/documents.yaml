replicaCount: 1

image:
  repository: gruzdev-dev/codex-documents
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  port: 8081

database:
  enabled: true
  image: "mongo:8.0"
  port: 27017
  env:
    - name: MONGO_INITDB_ROOT_USERNAME
      value: "admin"
    - name: MONGO_INITDB_ROOT_PASSWORD
      value: "admin_secret"
    - name: MONGO_INITDB_DATABASE
      value: "codex_documents"
    - name: MONGO_INITDB_USERNAME
      value: "codex_documents"
    - name: MONGO_INITDB_PASSWORD
      value: "secret"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/auth-url: "http://auth.codex.svc.cluster.local:8080/api/v1/validate"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-User-Id"

  hosts:
    - host: localhost
      paths:
        - path: /documents(/|$)(.*)
          pathType: ImplementationSpecific

podAnnotations:
  linkerd.io/inject: enabled

networkPolicy:
  enabled: true
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx
      - podSelector: {}
