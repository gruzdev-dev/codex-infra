replicaCount: 1

image:
  repository: gruzdev-dev/codex-auth
  tag: "0.1.0"
  pullPolicy: IfNotPresent

configMap:
  POSTGRES_HOST: "auth-db"
  POSTGRES_DB: "codex_auth"
  DOCUMENTS_SERVICE_ADDR: "documents.codex.svc.cluster.local:8081"

secret:
  JWT_SECRET: "jwt_secret"
  INTERNAL_SERVICE_SECRET: "internal_service_secret"
  POSTGRES_USER: "codex_auth"
  POSTGRES_PASSWORD: "secret"

service:
  http:
    enabled: true
    port: 8080
  grpc:
    enabled: true
    port: 8081

database:
  enabled: true
  image: "postgres:16-alpine"
  port: 5432
  migrations:
    enabled: true

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  hosts:
    - host: localhost
      paths:
        - path: /auth(/|$)(.*)
          pathType: ImplementationSpecific

podAnnotations:
  linkerd.io/inject: enabled

networkPolicy:
  enabled: true
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx
      - podSelector: {}