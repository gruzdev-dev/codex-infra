replicaCount: 1

image:
  repository: gruzdev-dev/codex-auth
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  port: 8080

database:
  enabled: true
  image: "postgres:16-alpine"
  port: 5432
  env:
    - name: POSTGRES_USER
      value: "codex_auth"
    - name: POSTGRES_PASSWORD
      value: "secret"
    - name: POSTGRES_DB
      value: "codex_auth"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  hosts:
    - host: localhost
      paths:
        - path: /auth(/|$)(.*)
          pathType: ImplementationSpecific

podAnnotations:
  linkerd.io/inject: enabled

networkPolicy:
  enabled: true
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx
      - podSelector: {}