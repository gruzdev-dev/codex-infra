replicaCount: 1

image:
  repository: minio/minio
  tag: "latest"
  pullPolicy: IfNotPresent

rootUser: "minioadmin"
rootPassword: "minioadmin"

pvc:
  enabled: true
  size: "50Gi"

provisioning:
  enabled: true
  bucket: "medical-documents"

ingress:
  enabled: true
  className: "nginx"
  apiHost: "s3.codex.local"
  consoleHost: "console.s3.codex.local"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"

podAnnotations:
  linkerd.io/inject: enabled
