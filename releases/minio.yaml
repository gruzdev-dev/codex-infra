pvc:
  size: "50Gi"

provisioning:
  bucket: "medical-documents"

ingress:
  apiHost: "s3.codex.local"
  consoleHost: "console.s3.codex.local"

podAnnotations:
  linkerd.io/inject: enabled

notify:
  webhook:
    enabled: true
    identifier: "codex"
    endpoint: "http://files.codex.svc.cluster.local:8080/api/v1/webhook/s3?secret=webhook_secret"
