# Values for the codex-documents microservice
replicaCount: 1

image:
  repository: gruzdev-dev/codex-documents # Замени на свой реальный Docker-репозиторий
  tag: "0.1.0"

service:
  port: 8081

podAnnotations:
  linkerd.io/inject: enabled

networkPolicy:
  enabled: true
  ingress:
    - from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: ingress-nginx
