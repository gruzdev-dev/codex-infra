replicaCount: 1

image:
  repository: gruzdev-dev/codex-files
  tag: "0.1.0"
  pullPolicy: IfNotPresent

configMap:
  POSTGRES_HOST: "files-db"
  POSTGRES_DB: "codex_files"
  S3_ENDPOINT: "http://minio-minio.codex.svc.cluster.local:9000"
  S3_EXTERNAL_HOST: "s3.codex.local"
  S3_BUCKET: "medical-documents"
  S3_USE_SSL: "false"

secret:
  JWT_SECRET: "jwt_secret"
  INTERNAL_SERVICE_SECRET: "internal_service_secret"
  POSTGRES_USER: "codex_files"
  POSTGRES_PASSWORD: "secret"
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin"

service:
  http:
    enabled: true
    port: 8080
  grpc:
    enabled: false

database:
  enabled: true
  image: "postgres:16-alpine"
  port: 5432
  migrations:
    enabled: true

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/auth-url: "http://auth.codex.svc.cluster.local:8080/api/v1/validate"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-User-Id"
  hosts:
    - host: localhost
      paths:
        - path: /files(/|$)(.*)
          pathType: ImplementationSpecific

podAnnotations:
  linkerd.io/inject: enabled

networkPolicy:
  enabled: true
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx
      - podSelector: {}
