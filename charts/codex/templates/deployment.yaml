apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codex.fullname" . }}
  labels:
    {{- include "codex.labels" . | nindent 4 }}
  {{- if and (hasKey .Values "database") (hasKey .Values.database "migrations") .Values.database.migrations.enabled }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "codex.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "codex.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            {{- if .Values.service.http.enabled }}
            - name: http
              containerPort: {{ .Values.service.http.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.service.grpc.enabled }}
            - name: grpc
              containerPort: {{ .Values.service.grpc.port }}
              protocol: TCP
            {{- end }}
          env:
            {{- if .Values.service.http.enabled }}
            - name: HTTP_PORT
              value: "{{ .Values.service.http.port }}"
            - name: SERVER_PORT
              value: "{{ .Values.service.http.port }}"
            {{- end }}
            {{- if .Values.service.grpc.enabled }}
            - name: GRPC_PORT
              value: "{{ .Values.service.grpc.port }}"
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- if .Values.service.http.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          {{- end }}
          resources: {}
